name: Publish LightStandards
on:
  push:
    branches: [main]
    paths-ignore: ['reports/**', 'research_notes/**', 'docs/**', 'n8n/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lightstandards-publish
  cancel-in-progress: false
jobs:
  publish:
    if: vars.SITE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_SITE_READY: 'true'
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL || 'linkingmain@gmail.com' }}
      PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
      PUBLIC_NAVER_SITE_VERIFICATION: ${{ vars.PUBLIC_NAVER_SITE_VERIFICATION }}
      PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
      PUBLIC_ADSENSE_SLOT: ${{ vars.PUBLIC_ADSENSE_SLOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run deploy:check
      - run: npm run import:article -- --inbox
      - run: npm run assets:optimize
      - name: Preserve imported Markdown and media
        run: |
          git config user.name 'lightstandards-bot'
          git config user.email 'lightstandards-bot@users.noreply.github.com'
          node scripts/preserve-imported.mjs
      - run: npm run build
      - name: Deploy static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
